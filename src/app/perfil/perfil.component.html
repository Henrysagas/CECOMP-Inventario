<div class="perfil-container">
  <h2>PERFIL DE USUARIO</h2>

  <nz-card class="perfil-card" [nzLoading]="loading">
    <nz-tabset class="perfil-tabs">
      <nz-tab nzTitle="Datos personales">
        <form [formGroup]="perfilForm" nz-form class="perfil-form">
          <nz-row [nzGutter]="[24, 8]">
            <nz-col [nzXs]="24" [nzMd]="12">
              <nz-form-item>
                <nz-form-label [nzSpan]="8">Nombres</nz-form-label>
                <nz-form-control [nzSpan]="16">
                  <input nz-input formControlName="nombres" placeholder="Nombres" />
                </nz-form-control>
              </nz-form-item>

              <nz-form-item>
                <nz-form-label [nzSpan]="8">Usuario</nz-form-label>
                <nz-form-control [nzSpan]="16">
                  <input nz-input formControlName="usuario" placeholder="Usuario" />
                </nz-form-control>
              </nz-form-item>

              <nz-form-item>
                <nz-form-label [nzSpan]="8">Estado</nz-form-label>
                <nz-form-control [nzSpan]="16">
                  <nz-select formControlName="estado" placeholder="Estado">
                    <nz-option nzValue="Activo" nzLabel="Activo"></nz-option>
                    <nz-option nzValue="Inactivo" nzLabel="Inactivo"></nz-option>
                  </nz-select>
                </nz-form-control>
              </nz-form-item>
            </nz-col>

            <nz-col [nzXs]="24" [nzMd]="12">
              <nz-form-item>
                <nz-form-label [nzSpan]="8">Apellidos</nz-form-label>
                <nz-form-control [nzSpan]="16">
                  <input nz-input formControlName="apellidos" placeholder="Apellidos" />
                </nz-form-control>
              </nz-form-item>

              <nz-form-item>
                <nz-form-label [nzSpan]="8">DNI</nz-form-label>
                <nz-form-control [nzSpan]="16">
                  <input nz-input formControlName="dni" placeholder="DNI" />
                </nz-form-control>
              </nz-form-item>

              <nz-form-item>
                <nz-form-label [nzSpan]="8">Cargo</nz-form-label>
                <nz-form-control [nzSpan]="16">
                  <input nz-input formControlName="cargo" placeholder="Cargo" />
                </nz-form-control>
              </nz-form-item>

              <nz-form-item>
                <nz-form-label [nzSpan]="8">Rol</nz-form-label>
                <nz-form-control [nzSpan]="16">
                  <input nz-input [value]="rolLabel" disabled />
                </nz-form-control>
              </nz-form-item>
            </nz-col>
          </nz-row>
        </form>
      </nz-tab>

      <nz-tab nzTitle="Actualizar contrase&ntilde;a">
        <form [formGroup]="passwordForm" nz-form class="password-form" (ngSubmit)="updatePassword()">
          <nz-form-item>
            <nz-form-label [nzSpan]="8" nzRequired>Contrase&ntilde;a actual</nz-form-label>
            <nz-form-control [nzSpan]="16">
              <input nz-input type="password" formControlName="oldPassword" placeholder="Contrase&ntilde;a actual" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label [nzSpan]="8" nzRequired>Nueva contrase&ntilde;a</nz-form-label>
            <nz-form-control [nzSpan]="16">
              <input nz-input type="password" formControlName="newPassword" placeholder="Nueva contrase&ntilde;a" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label [nzSpan]="8" nzRequired>Confirmar</nz-form-label>
            <nz-form-control [nzSpan]="16">
              <input nz-input type="password" formControlName="confirmPassword" placeholder="Confirmar contrase&ntilde;a" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item class="perfil-actions">
            <button nz-button nzType="primary" class="update-password-button" [disabled]="passwordForm.invalid">
              Actualizar contrase&ntilde;a
            </button>
          </nz-form-item>
        </form>
      </nz-tab>
    </nz-tabset>
  </nz-card>
</div>
