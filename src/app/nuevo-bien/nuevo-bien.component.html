<section class="detalles-page">
  <div class="view-actions">
    <button type="button" class="btn btn-light" (click)="cancelar()">Volver</button>
  </div>

  <form class="descripcion-column" (ngSubmit)="guardarBien()">
    <div class="detalles-header">
      <div>
        <p class="eyebrow">Inventario</p>
        <h2>Agregar bien</h2>
        <p class="subtitle">Registra la informaci&oacute;n principal y el movimiento inicial del bien.</p>
      </div>
      <span class="status-pill">Nuevo registro</span>
    </div>

    <div class="section-title">
      <h3>Descripci&oacute;n del bien</h3>
    </div>

    <div class="bien-detalles-grid">
      <div class="form-group field-highlight">
        <label for="idBien">ID del Bien</label>
        <input id="idBien" type="text" [(ngModel)]="nuevoBien.codigo" name="idBien" required>
      </div>

      <div class="form-group">
        <label for="categoria">Categor&iacute;a</label>
        <select id="categoria" [(ngModel)]="nuevoBien.ID_CATEGORIA" name="categoria" required>
          <option *ngFor="let categoria of categorias" [value]="categoria.id">{{ categoria.NOMBRE_CATEGORIA }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="usuarioAsignado">Usuario Asignado</label>
        <select id="usuarioAsignado" [(ngModel)]="nuevoBien.ID_USUARIO" name="usuarioAsignado" required>
          <option *ngFor="let usuario of usuariosAdministradores" [value]="usuario.id">
            {{ usuario.NOMBRES }} {{ usuario.APELLIDOS }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="modelo">Modelo</label>
        <input id="modelo" type="text" [(ngModel)]="nuevoBien.MODELO" name="modelo">
      </div>

      <div class="form-group">
        <label for="tipo">Tipo</label>
        <input id="tipo" type="text" [(ngModel)]="nuevoBien.TIPO" name="tipo">
      </div>

      <div class="form-group">
        <label for="color">Color</label>
        <input id="color" type="text" [(ngModel)]="nuevoBien.COLOR" name="color">
      </div>

      <div class="form-group form-group--wide">
        <label for="dimension">Dimensi&oacute;n</label>
        <textarea id="dimension" [(ngModel)]="nuevoBien.DIMENSION" name="dimension"></textarea>
      </div>

      <div class="form-group form-group--wide">
        <label for="numeroSerie">N&uacute;mero de Serie</label>
        <textarea id="numeroSerie" [(ngModel)]="nuevoBien.NUMERO_SERIE" name="numeroSerie"></textarea>
      </div>

      <div class="form-group form-group--wide">
        <label for="descripcion">Otros</label>
        <input id="descripcion" type="text" [(ngModel)]="nuevoBien.DESCRIPCION" name="descripcion">
      </div>
    </div>

    <div class="section-title section-title--movement">
      <h3>Movimiento inicial</h3>
    </div>

    <div class="bien-detalles-grid movimiento-grid">
      <div class="form-group">
        <label for="ubicacion">Ubicaci&oacute;n</label>
        <select id="ubicacion" [(ngModel)]="selectedUbicacionId" name="ubicacion" (change)="onUbicacionChange($event)" required>
          <option *ngFor="let ubicacion of ubicaciones" [value]="ubicacion.ID_UBICACION">{{ ubicacion.NOMBRE }}</option>
        </select>
      </div>

      <div class="form-group" *ngIf="showAmbienteSelect">
        <label for="ambiente">Ambiente</label>
        <select id="ambiente" [(ngModel)]="selectedAmbienteId" name="ambiente" required>
          <option *ngFor="let ambiente of ambientes" [value]="ambiente.ID_AMBIENTE">{{ ambiente.NOMBRE_AMBIENTE }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="estado">Estado</label>
        <select id="estado" [(ngModel)]="selectedEstado" name="estado" required>
          <option *ngFor="let estado of estados" [value]="estado">{{ estado }}</option>
        </select>
      </div>
    </div>

    <div class="action-buttons">
      <button type="submit" class="btn btn-danger" [disabled]="!selectedAmbienteId || !selectedEstado">Guardar Bien</button>
      <button type="button" class="btn btn-dark" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</section>
