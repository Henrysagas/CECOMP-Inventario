<div class="usuarios-container">
  <h2>GESTI&Oacute;N DE USUARIOS</h2>

  <div class="usuarios-toolbar">
    <div class="filter-field">
      <label>Rol</label>
      <nz-select
        [(ngModel)]="rolFiltro"
        nzAllowClear
        nzPlaceHolder="Todos los roles">
        <nz-option
          *ngFor="let rol of roles"
          [nzValue]="rol.id"
          [nzLabel]="rol.nombre">
        </nz-option>
      </nz-select>
    </div>

    <div class="filter-field">
      <label>Condici&oacute;n</label>
      <nz-select [(ngModel)]="estadoFiltro">
        <nz-option nzValue="activos" nzLabel="Activos"></nz-option>
        <nz-option nzValue="inactivos" nzLabel="Inactivos"></nz-option>
        <nz-option nzValue="todos" nzLabel="Todos"></nz-option>
      </nz-select>
    </div>

    <button type="button" nz-button nzType="default" (click)="limpiarFiltrosUsuarios()">Limpiar filtros</button>
    <button type="button" nz-button nzType="primary" class="login-form-button" (click)="navigateToRegister()">Registrar usuario</button>
  </div>

  <div class="usuarios-summary">
    Mostrando {{ usuariosFiltrados.length }} de {{ usuarios.length }} usuarios.
  </div>

  <nz-table
    #usuariosTable
    [nzData]="usuariosFiltrados"
    [nzBordered]="false"
    [nzSize]="'middle'"
    [nzShowPagination]="true"
    [nzPageSize]="8"
    class="tabla-contenedor">
    <thead>
      <tr>
        <th nzWidth="18%">Nombres</th>
        <th nzWidth="18%">Apellidos</th>
        <th nzWidth="17%">Usuario</th>
        <th nzWidth="15%">Rol</th>
        <th nzWidth="12%">Estado</th>
        <th nzWidth="20%">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let usuario of usuariosTable.data">
        <td>{{ usuario.NOMBRES }}</td>
        <td>{{ usuario.APELLIDOS }}</td>
        <td>{{ usuario.USU }}</td>
        <td>
          <nz-select [(ngModel)]="usuario.ID_ROL" (ngModelChange)="onRolChange(usuario)">
            <nz-option *ngFor="let rol of roles" [nzValue]="rol.id" [nzLabel]="rol.nombre"></nz-option>
          </nz-select>
        </td>
        <td>{{ usuario.estado }}</td>
        <td>
          <div class="acciones-usuario">
            <button
              type="button"
              nz-button
              nzType="default"
              (click)="abrirEditarUsuario(usuario)">
              Editar
            </button>
            <button
              type="button"
              nz-button
              nzType="primary"
              (click)="cambiarEstadoUsuario(usuario)">
              {{ usuario.estado === 'Activo' ? 'Inactivar' : 'Activar' }}
            </button>
          </div>
        </td>
      </tr>
      <tr *ngIf="usuariosFiltrados.length === 0">
        <td colspan="6" class="empty-cell">No hay usuarios para los filtros seleccionados.</td>
      </tr>
    </tbody>
  </nz-table>
</div>

<nz-modal
  [nzVisible]="!!usuarioEditando"
  nzTitle="Editar usuario"
  [nzOkLoading]="guardandoUsuario"
  nzOkText="Guardar"
  nzCancelText="Cancelar"
  (nzOnCancel)="cancelarEdicionUsuario()"
  (nzOnOk)="guardarUsuarioEditado()">
  <ng-container *nzModalContent>
    <div class="editar-usuario-form" *ngIf="usuarioEditando">
      <label>
        Nombres
        <input nz-input [(ngModel)]="usuarioEditando.NOMBRES" placeholder="Nombres" />
      </label>

      <label>
        Apellidos
        <input nz-input [(ngModel)]="usuarioEditando.APELLIDOS" placeholder="Apellidos" />
      </label>

      <label>
        Usuario
        <input nz-input [(ngModel)]="usuarioEditando.USU" placeholder="Usuario" />
      </label>

      <label>
        DNI
        <input nz-input [(ngModel)]="usuarioEditando.dni" placeholder="DNI" />
      </label>

      <label>
        Cargo
        <input nz-input [(ngModel)]="usuarioEditando.cargo" placeholder="Cargo" />
      </label>

      <label>
        Rol
        <nz-select [(ngModel)]="usuarioEditando.ID_ROL">
          <nz-option *ngFor="let rol of roles" [nzValue]="rol.id" [nzLabel]="rol.nombre"></nz-option>
        </nz-select>
      </label>
    </div>
  </ng-container>
</nz-modal>
