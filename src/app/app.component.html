<nz-layout class="app-layout">
  <button
    type="button"
    class="mobile-menu-toggle"
    (click)="toggleSidebar()"
    [attr.aria-expanded]="!isCollapsed"
    aria-label="Abrir o cerrar menu">
    <span nz-icon [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'" nzTheme="outline"></span>
  </button>
  <button
    *ngIf="isMobile && !isCollapsed"
    type="button"
    class="sidebar-backdrop"
    aria-label="Cerrar menu"
    (click)="closeMobileMenu()">
  </button>
  <nz-sider class="menu-sidebar light-theme"
  nzCollapsible
    nzWidth="350px"
    [nzCollapsedWidth]="isMobile ? 0 : 80"
    nzBreakpoint="md"
    [(nzCollapsed)]="isCollapsed"
    [nzTrigger]="null">
    <div class="sidebar-logo">
      <a href="/welcome" target="_blank">
        <img src="cecomp.png" alt="Logo" width="350" /> <!-- Mantener solo el logo -->
      </a>
    </div>
    <ul nz-menu nzTheme="light" nzMode="inline" [nzInlineCollapsed]="isCollapsed">
      <li nz-submenu nzOpen nzTitle="Dashboard">
        <ul>
          <li *ngIf="isLoggedIn" nz-menu-item nzMatchRouter>
            <a routerLink="/verbienes" (click)="closeMobileMenu()">
              <span class="sidebar-menu-icon" nz-icon nzType="appstore" nzTheme="outline"></span>
              Ver Bienes
            </a>
          </li>
          <li *ngIf="isLoggedIn && isAdmin" nz-menu-item nzMatchRouter>
            <a routerLink="/bienes" (click)="closeMobileMenu()">
              <span class="sidebar-menu-icon" nz-icon nzType="database" nzTheme="outline"></span>
              Bienes (Administrar)
            </a>
          </li>
          <li *ngIf="isLoggedIn && isAdmin" nz-menu-item  nzMatchRouter>
            <a routerLink="/categorias" (click)="closeMobileMenu()">
              <span class="sidebar-menu-icon" nz-icon nzType="tags" nzTheme="outline"></span>
              Categorías
            </a>
          </li>

          <li *ngIf="isLoggedIn && isAdmin" nz-menu-item nzMatchRouter>
            <a routerLink="/ambientes" (click)="closeMobileMenu()">
              <span class="sidebar-menu-icon" nz-icon nzType="bank" nzTheme="outline"></span>
              Ambientes
            </a>
          </li>
          <li *ngIf="isLoggedIn" nz-menu-item nzMatchRouter>
            <a routerLink="/reportes" (click)="closeMobileMenu()">
              <span class="sidebar-menu-icon" nz-icon nzType="bar-chart" nzTheme="outline"></span>
              Reportes
            </a>
          </li>
          <li *ngIf="isLoggedIn && isSuperAdmin" nz-menu-item nzMatchRouter>
            <a routerLink="/usuarios" (click)="closeMobileMenu()">
              <span class="sidebar-menu-icon" nz-icon nzType="team" nzTheme="outline"></span>
              Usuarios
            </a>
          </li>
          <li *ngIf="isLoggedIn && isAdmin" nz-menu-item nzMatchRouter>
            <a routerLink="/log-visitas" (click)="closeMobileMenu()">
              <span class="sidebar-menu-icon" nz-icon nzType="history" nzTheme="outline"></span>
              Log de visitas
            </a>
          </li>
          <li *ngIf="isLoggedIn && isAdmin" nz-menu-item nzMatchRouter>
            <a routerLink="/observaciones" (click)="closeMobileMenu()">
              <span class="sidebar-menu-icon" nz-icon nzType="message" nzTheme="outline"></span>
              Observaciones
            </a>
          </li>
          <li *ngIf="isLoggedIn" nz-menu-item nzMatchRouter>
            <a routerLink="/perfil" (click)="closeMobileMenu()">
              <span class="sidebar-menu-icon" nz-icon nzType="user" nzTheme="outline"></span>
              Perfil
            </a>
          </li>
          <li nz-menu-item (click)="gestionarSesion()" style="margin-top: auto;">
            <span class="sidebar-menu-icon" nz-icon [nzType]="isLoggedIn ? 'logout' : 'login'" nzTheme="outline"></span>
            {{ isLoggedIn ? 'Cerrar Sesión' : 'Iniciar Sesión' }}
          </li>
          
        </ul>
      </li>
    </ul>
  </nz-sider>
  <nz-layout>
<nz-content>
  <div class="inner-content">
    <router-outlet></router-outlet>
  </div>
</nz-content>
</nz-layout>
</nz-layout>
